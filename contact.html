      <form class="c-grid" id="contact-form" novalidate>
        <label>
          <span class="field-label">NAME</span>
          <input class="c-input" id="name" name="name" type="text" placeholder="Your name" required>
        </label>
        <label>
          <span class="field-label">EMAIL</span>
          <input class="c-input" id="email" name="email" type="email" placeholder="you@example.com" required>
        </label>
        <label>
          <span class="field-label">SUBJECT</span>
          <input class="c-input" id="subject" name="subject" type="text" placeholder="What's this about?" required>
        </label>
        <label>
          <span class="field-label">MESSAGE</span>
          <textarea class="c-textarea" id="message" name="message" placeholder="Your message..." required></textarea>
        </label>
        <button class="c-btn" id="send-btn" type="submit">
          <svg viewBox="0 0 24 24"><path d="M2 12l20-9-6 9 6 9-20-9z"/></svg>

      </form>

<!-- Toast container -->
<div class="toast-wrap" id="toast-wrap" aria-live="polite"></div>

<script>
(function(){
  const form = document.getElementById('contact-form');
  const toastWrap = document.getElementById('toast-wrap');
  const sendBtn = document.getElementById('send-btn');
  const btnText = document.getElementById('btn-text');
  function createToast(text){
    const t = document.createElement('div');
    t.className = 'toast';
    t.innerHTML = '<svg viewBox="0 0 24 24" style="width:14px;height:14px;stroke:#070b18;stroke-width:2.5;fill:none;flex-shrink:0"><polyline points="20 6 9 17 4 12"/></svg>' + text;
    toastWrap.appendChild(t);
    setTimeout(()=>{ t.style.transition='opacity .25s,transform .25s'; t.style.opacity='0'; t.style.transform='translateY(12px)'; setTimeout(()=>t.remove(),280); },3200);
  }
  form.addEventListener('submit', function(e){
    e.preventDefault();
    btnText.textContent = 'TRANSMITTING...';
    sendBtn.disabled = true;
    setTimeout(()=>{ form.reset(); createToast('MESSAGE TRANSMITTED'); btnText.textContent='TRANSMIT MESSAGE'; sendBtn.disabled=false; }, 600);
  });
})();
</script>
</body>
